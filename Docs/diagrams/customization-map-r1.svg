    <rect x="780" y="340" width="390" height="95"/>
    <rect x="780" y="475" width="390" height="85"/>
  </g>
  <text x="390" y="98">Configure backend</text>
  <text x="390" y="126">and game key</text>
  <text x="800" y="140">SubscriptionSettings.asset</text>
  <text x="390" y="218">Tune colors and</text>
  <text x="390" y="246">motion duration</text>
  <text x="800" y="260">DefaultGameUITheme.asset</text>
  <text x="390" y="376">Edit layout and labels</text>
  <text x="800" y="378">Scenes and</text>
  <text x="800" y="409">MenuButtonFace.prefab</text>
  <text x="390" y="483">Change validated</text>
  <text x="390" y="511">application rules</text>
  <text x="800" y="510">Account scripts and</text>
  <text x="800" y="541">PHP source</text>
</svg>
