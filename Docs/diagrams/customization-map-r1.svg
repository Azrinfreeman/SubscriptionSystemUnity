<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Segoe UI, sans-serif" font-size="24" fill="#203645" role="img" aria-labelledby="title desc">
  <title id="title">Choose the source that owns the change</title>
  <desc id="desc">An editing guide, not a runtime dependency diagram. Configure backend and game key in SubscriptionSettings.asset; tune colors and motion duration in DefaultGameUITheme.asset; edit layout and labels in scenes and MenuButtonFace.prefab; change validated application rules in account scripts and PHP source.</desc>
  <rect width="1200" height="630" fill="#FFFFFF"/>
