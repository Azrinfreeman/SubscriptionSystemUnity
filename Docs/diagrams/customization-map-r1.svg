  <rect x="30" y="275" width="255" height="95" fill="#205F75"/>
  <text x="52" y="312" fill="#FFFFFF">What are you</text>
  <text x="52" y="344" fill="#FFFFFF">changing?</text>
  <g fill="none" stroke="#203645" stroke-width="2">
    <path d="M285 322 H335 M335 135 V520 M335 135 H770 M335 255 H770 M335 385 H770 M335 520 H770"/>
    <path d="M760 128 L770 135 L760 142 M760 248 L770 255 L760 262 M760 378 L770 385 L760 392 M760 513 L770 520 L760 527"/>
    <rect x="780" y="90" width="390" height="85"/>
